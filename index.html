<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>ASAaei — Fill &amp; Sign Documents</title>
    <script>
      // Self-heal against a blank screen. The usual cause after a redeploy is a
      // stale copy of this page — from the service worker's cache, the
      // browser's HTTP cache, or the GitHub Pages CDN, which keeps serving the
      // old index.html for up to ten minutes — still naming hashed asset URLs
      // that the new deploy has deleted. The module 404s and #root stays
      // empty. If we detect that, we unregister the service worker, wipe the
      // caches and load the page again ONCE, at a URL with a fresh query
      // parameter so every cache between here and the origin treats it as
      // new. A sessionStorage guard stops a loop if the blank screen has some
      // other cause; a healthy render clears it and tidies the URL.
      (function () {
        var GUARD = 'asaaei:self-healed'
        var ENGINE_CACHE = 'asaaei-libreoffice-engine-v1'
        function freshUrl(param) {
          var u = new URL(location.href)
          u.searchParams.set(param, String(Date.now()))
          return u.href
        }
        function heal(reason) {
          if (sessionStorage.getItem(GUARD)) return // already tried this session
          try { sessionStorage.setItem(GUARD, reason || '1') } catch (e) {}
          // The worker is about to go, so the "already reloaded for isolation"
          // note must go with it: the re-installed worker needs that reload.
          try { sessionStorage.removeItem('asaaei:coi-reload') } catch (e) {}
          var jobs = []
          if ('serviceWorker' in navigator) {
            jobs.push(
              navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) })
                .catch(function () {})
            )
          }
          if (window.caches && caches.keys) {
            jobs.push(
              caches.keys()
                .then(function (ks) {
                  // The LibreOffice engine cache is a 78 MB download and has
                  // nothing to do with a stale build, so it is kept.
                  ks = ks.filter(function (k) { return k !== ENGINE_CACHE })
                  return Promise.all(ks.map(function (k) { return caches.delete(k) }))
                })
                .catch(function () {})
            )
          }
          var reload = function () { location.replace(freshUrl('heal')) }
          Promise.all(jobs).then(reload, reload)
        }
        // A failed app script/stylesheet is the clearest blank-screen signal.
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) heal('asset')
        }, true)
        // Fallback: nothing mounted a while after load → treat as blank. Eight
        // seconds, not four: on a tablet on mobile data the app bundle can
        // legitimately take that long, and healing a slow load only restarts it.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (!root || root.childElementCount === 0) { heal('empty'); return }
            try { sessionStorage.removeItem(GUARD) } catch (e) {}
            // Healthy: drop the cache-busting parameters a heal or an update
            // left in the address, so the URL a technician bookmarks is clean.
            try {
              var u = new URL(location.href)
              if (u.searchParams.has('heal') || u.searchParams.has('v')) {
                u.searchParams.delete('heal'); u.searchParams.delete('v')
                history.replaceState(history.state, '', u.href)
              }
            } catch (e) {}
          }, 8000)
        })
      })()
    </script>
    <script>
      // The service worker: offline precache, and — on hosts that cannot set
      // headers (GitHub Pages) — the COOP/COEP headers that make the page
      // cross-origin isolated so the in-website LibreOffice engine can run.
      // A page only becomes isolated when its OWN response carried the
      // headers, which for a freshly-installed worker means one reload. That
      // reload is done here, once, guarded so a page that cannot be isolated
      // (plain http from another machine) never loops. On a server that
      // already sends the headers (npm run serve, the dev server)
      // crossOriginIsolated is true from the start and the reload never fires.
      (function () {
        if (!('serviceWorker' in navigator)) return
        var KEY = 'asaaei:coi-reload'
        // The guard exists to stop a loop: controlled, reloaded, still not
        // isolated, reload again... That loop can only start from a page that
        // was controlled when it loaded. A page that loads uncontrolled (first
        // visit, after "check for update", after a self-heal) has no such
        // history, so any note left by an earlier page in this tab is stale
        // and would wrongly veto the one reload this page needs.
        if (!navigator.serviceWorker.controller) {
          try { sessionStorage.removeItem(KEY) } catch (e) {}
        }
        function reloadOnce() {
          if (window.crossOriginIsolated) return
          if (!navigator.serviceWorker.controller) return // not controlled yet
          if (sessionStorage.getItem(KEY)) return
          try { sessionStorage.setItem(KEY, '1') } catch (e) {}
          location.reload()
        }
        // updateViaCache 'none': the worker script always comes from the
        // network, never the browser's HTTP cache, so a new deploy is seen on
        // the next visit rather than up to a day later.
        function register() {
          return navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
        }
        // Registration can fail outright — for up to ten minutes after a
        // deploy the GitHub Pages CDN can still hand out the previous sw.js,
        // whose precache list names files the deploy deleted. Until it
        // succeeds the page is not isolated and Word files cannot convert, so
        // try again, a few times, spaced out; the first success claims the
        // page and the reload above fires.
        var attempts = [6000, 20000, 45000, 90000, 180000]
        function retry(i) {
          if (i >= attempts.length) return
          setTimeout(function () {
            if (window.crossOriginIsolated || navigator.serviceWorker.controller) return
            register().catch(function () {}).then(function () { retry(i + 1) })
          }, attempts[i])
        }
        window.addEventListener('load', function () {
          register().catch(function () {})
          if (!window.crossOriginIsolated) retry(0)
        })
        if (!window.crossOriginIsolated) {
          navigator.serviceWorker.ready.then(reloadOnce).catch(function () {})
          // First-ever visit: the worker claims the page moments after install.
          navigator.serviceWorker.addEventListener('controllerchange', reloadOnce)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- What the page shows until the app's script has arrived and mounted:
           a card, never a blank screen. React replaces all of this on mount.
           If the app has not started after a while, the card says what it
           can see — which page was served, whether the service worker is in
           charge, whether the page is isolated — and offers a fresh load. -->
      <div id="boot" style="min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:clamp(28px,8vh,92px) 20px 40px;background:linear-gradient(180deg,#f4f7fc 0%,#eaeff8 100%);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#26314c">
        <div style="width:100%;max-width:520px;background:#fff;border-radius:22px;padding:28px 30px;border:1px solid rgba(38,56,102,.09);box-shadow:0 1px 2px rgba(38,56,102,.05),0 26px 50px -30px rgba(38,56,102,.55)">
          <div style="font-size:22px;font-weight:700;color:#1f2a47">ASAaei</div>
          <p id="boot-msg" style="margin:10px 0 0;font-size:15px;line-height:1.6;color:#5f6b86">Loading…</p>
          <p id="boot-diag" style="margin:12px 0 0;font-size:12.5px;line-height:1.6;color:#8691a8;display:none"></p>
          <button id="boot-reload" type="button" style="display:none;margin-top:16px;font:inherit;font-size:15px;font-weight:650;color:#fff;background:#2f4a95;border:none;border-radius:12px;padding:12px 22px;cursor:pointer">Load again</button>
        </div>
      </div>
    </div>
    <script>
      // The loading card's clock. Nothing here touches the app once it has
      // mounted (the card is gone by then and every lookup finds nothing).
      (function () {
        var PAGE_BUILD = '%BUILD_ID%'
        var started = Date.now()
        var scriptFailed = false
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (t && t.tagName === 'SCRIPT') scriptFailed = true
        }, true)
        function diag() {
          var sw = 'serviceWorker' in navigator
            ? (navigator.serviceWorker.controller ? 'service worker in charge' : 'no service worker in charge')
            : 'service workers unsupported'
          return 'Page build ' + PAGE_BUILD + ' · ' + sw + ' · '
            + (window.crossOriginIsolated ? 'isolated' : 'not isolated') + ' · '
            + (navigator.onLine ? 'online' : 'offline') + ' · '
            + Math.round((Date.now() - started) / 1000) + ' s'
        }
        function say(msg, showReload) {
          var m = document.getElementById('boot-msg')
          if (!m) return false // the app has mounted; the card is gone
          m.textContent = msg
          var d = document.getElementById('boot-diag')
          d.style.display = 'block'; d.textContent = diag()
          var b = document.getElementById('boot-reload')
          if (showReload) {
            b.style.display = 'inline-block'
            b.onclick = function () {
              try { sessionStorage.clear() } catch (e) {}
              var u = new URL(location.href); u.searchParams.set('heal', String(Date.now()))
              location.replace(u.href)
            }
          }
          return true
        }
        setTimeout(function () {
          say(scriptFailed
            ? 'The app’s files could not be loaded. The page may be a stale copy — load it again.'
            : 'Still loading. On a slow connection the app takes a little while the first time; after that it is kept on this device.', scriptFailed)
        }, 6000)
        setTimeout(function () {
          say(scriptFailed
            ? 'The app’s files could not be loaded. The page may be a stale copy — load it again.'
            : 'The app has not started. Load the page again; if this keeps happening, send a photo of this card.', true)
        }, 20000)
        // Keep the diagnostic line current while the card is showing.
        var tick = setInterval(function () {
          var d = document.getElementById('boot-diag')
          if (!d) { clearInterval(tick); return }
          if (d.style.display === 'block') d.textContent = diag()
        }, 1000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
