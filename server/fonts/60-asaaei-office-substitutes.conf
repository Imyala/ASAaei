<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ASAaei — substitutes for the Microsoft Office fonts our documents use.

  Without these rules fontconfig answers "Verdana" with whatever sans font
  sorts first (Noto Sans on a stock Ubuntu), which is noticeably narrower than
  Verdana: text set in it re-wraps, tables gain rows and the page count drifts.
  DejaVu Sans shares Verdana's wide proportions and large x-height, so the
  layout holds together far better.

  These are FALLBACKS. If the real font is installed — Verdana from a licensed
  Microsoft font pack, say — fontconfig finds it first and these rules never
  fire, because each rule only prepends a *preference*; it does not rename or
  replace an installed family.

  Install to  /etc/fonts/conf.d/  (all users)  or  ~/.config/fontconfig/conf.d/
  and run `fc-cache -f`. server/setup-fonts.sh does this for you.
-->
<fontconfig>

  <!-- ==== Metric-compatible: same glyph widths, so line breaks are identical -->

  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Caladea</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Arial Narrow</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans Narrow</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>

  <!-- ==== No free metric clone exists: closest proportions instead ==========
       Text in these fonts can still re-wrap. Install the genuine font on the
       conversion machine when a form depends on exact pagination. -->

  <!-- Verdana and Tahoma are wide with a tall x-height; DejaVu Sans is the
       closest widely-packaged match. Noto Sans (the stock default) is much
       narrower and visibly shortens these lines. -->
  <match target="pattern">
    <test name="family"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Georgia</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Trebuchet MS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>

  <!-- Japanese fonts appear in these documents via Word's East Asian defaults,
       usually on characters that never render. Map them so a stray glyph is not
       a blank box. -->
  <match target="pattern">
    <test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>MS Mincho</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>

  <!-- Symbol/dingbat families: OpenSymbol ships with LibreOffice and carries
       the bullet and tick glyphs these are used for in checklists. -->
  <match target="pattern">
    <test name="family"><string>Wingdings</string></test>
    <edit name="family" mode="append" binding="weak"><string>OpenSymbol</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Symbol</string></test>
    <edit name="family" mode="append" binding="weak"><string>OpenSymbol</string></edit>
  </match>

</fontconfig>
